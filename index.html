<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mural dos Sonhadores — HQ Games</title>
<style>
	:root { --tinta: #2b2340; --papel: #fff4e0; --ouro: #ffd75e; --lilas: #6a5fa0; }
	* { box-sizing: border-box; }
	body { margin: 0; min-height: 100vh; font-family: "Trebuchet MS", system-ui, sans-serif; color: var(--tinta);
		background: linear-gradient(#7fd0ff, #cdeeff 55%, #ffd8ee); display: flex; justify-content: center; }
	main { width: min(720px, 94vw); margin: 40px 0; background: var(--papel); border: 4px solid var(--tinta);
		border-radius: 14px; box-shadow: 0 6px 0 var(--tinta); padding: 28px 32px; }
	h1 { margin: 0 0 4px; color: var(--lilas); font-size: 2rem; }
	.sub { margin: 0 0 24px; }
	h2 { color: var(--lilas); border-bottom: 3px solid var(--ouro); display: inline-block; margin: 22px 0 10px; }
	ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px 18px; }
	li::before { content: "★ "; color: #f2a93b; }
	.guardiao li { font-weight: bold; font-size: 1.1rem; }
	footer { margin-top: 28px; font-size: .85rem; opacity: .75; }
</style>
</head>
<body>
<main>
	<h1>Mural dos Sonhadores</h1>
	<p class="sub">Gente que ajudou os jogos da <b id="estudio">HQ Games</b> a existirem. Obrigado! Todos estes nomes aparecem nos créditos dos jogos.</p>
	<div id="lista">Carregando…</div>
	<footer>Atualizado em <span id="data">—</span>. Lista em <a href="apoiadores.json">apoiadores.json</a>.</footer>
</main>
<script>
fetch("apoiadores.json", {cache: "no-store"}).then(r => r.json()).then(d => {
	document.getElementById("estudio").textContent = d.estudio || "HQ Games";
	document.getElementById("data").textContent = d.atualizado || "—";
	const lista = document.getElementById("lista");
	lista.textContent = "";
	const niveis = (d.niveis || []).slice().sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
	for (const n of niveis) {
		const nomes = (d.apoiadores || []).filter(a => a.nivel === n.id).map(a => a.nome);
		if (!nomes.length) continue;
		const h = document.createElement("h2"); h.textContent = n.nome; lista.appendChild(h);
		const ul = document.createElement("ul"); ul.className = n.id;
		for (const nome of nomes) { const li = document.createElement("li"); li.textContent = nome; ul.appendChild(li); }
		lista.appendChild(ul);
	}
}).catch(() => { document.getElementById("lista").textContent = "Não deu para carregar a lista agora."; });
</script>
</body>
</html>
